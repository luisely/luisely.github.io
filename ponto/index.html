<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <title>Registrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
  body {
    font-family: "Inter", sans-serif;
  }
</style>

<body class="bg-zinc-900 flex flex-col items-center justify-center min-h-screen gap-2">
  <div class="w-full max-w-xs mx-auto gap-2 flex items-center">
    <input class="w-full max-w-xs py-3 px-4 bg-zinc-300 rounded-lg outline-none text-lg hover:bg-zinc-100 transition"
      type="text" id="name" placeholder="Nome" />
    <input class="w-24 max-w-xs py-3 px-4 bg-zinc-300 rounded-lg outline-none text-lg hover:bg-zinc-100 transition"
      type="number" id="digits" inputmode="numeric" pattern="[0-9]*" placeholder="3 Digits" />
  </div>
  <div class="w-full max-w-xs flex flex-col">
    <button id="registerBtn"
      class="w-full py-3 bg-blue-600 text-white rounded-lg shadow-lg text-lg font-semibold hover:bg-blue-700 transition">
      Registrar
    </button>
    <div id="version" class="mt-1 text-right text-white text-xs opacity-20">v0.4</div>
  </div>
  <div id="result" class="h-2 mt-1 text-center text-white text-sm"></div>

  <script>
    if(localStorage.getItem('000_name') && localStorage.getItem('000_digits')) {
      const name = localStorage.getItem('000_name');
      const digits = localStorage.getItem('000_digits');
      document.getElementById('name').value = name;
      document.getElementById('digits').value = digits;
    }
    document.getElementById('registerBtn').addEventListener('click', async () => {

      const btn = document.getElementById('registerBtn');
      const resultDiv = document.getElementById('result');
      const name = document.getElementById('name').value.trim();
      const digits = document.getElementById('digits').value.trim();

      if (!name || !digits) {
        resultDiv.textContent = 'Por favor, preencha todos os campos.';
        return;
      }

      // Pega data atual no formato BR (dd/mm/yyyy)
      const now = new Date();
      const dateBR = now.toLocaleDateString('pt-BR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });

      btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 inline-block text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                        </svg> Registrando...`;
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      try {
        const response = await fetch('https://t6d9wao8qd.execute-api.us-east-1.amazonaws.com/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            PK: name,
            SK: digits.toString(),
            name,
            cpf3Digits: digits,
            date: dateBR,
            time: now.toLocaleTimeString('pt-BR', {
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            })
          })
        });

        if (response.ok) {
          const data = await response.json();
          resultDiv.textContent = 'Registrado com sucesso!';
        } else {
          resultDiv.textContent = 'Erro ao registrar.';
        }
      } catch (error) {
        resultDiv.textContent = 'Falha de conexão.';
      } finally {
        btn.innerHTML = 'Registrar';
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
        localStorage.setItem('000_name', name);
        localStorage.setItem('000_digits', digits);
      }
    });
  </script>
</body>
