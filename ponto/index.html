<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Registrar">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/css/datepicker.min.css">
  <link rel="stylesheet" type="text/css" href="./css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=SUSE+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/datepicker-full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/locales/pt.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script type="module" src="vars3.js"></script>
  <script type="module" src="axios.js"></script>


  <style>
    input {
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
  </style>

  <title>Registrar</title>
</head>

<body class="dark:bg-black w-dvw h-dvh flex items-center justify-center py-4">
  <div class="flex flex-col items-center justify-center h-full w-full max-w-xs">
    <div class="w-full"></div>

    <!-- INPUTS USERS DATA -->
    <div class="dark:text-white text-lg">
      <form id="form">
        <div
          class="w-full max-w-xs mx-auto flex border-b border-l border-t border-r rounded-t-md dark:border-zinc-500/35 border-blue-500 items-center px-1">
          <input
            class="w-48 h-8 max-w-xs px-2 dark:bg-black outline-none rounded-md border-r dark:border-zinc-500/35 border-blue-500"
            type="text" id="name" placeholder="Nome" maxlength="20" spellcheck="false" />
          <input id="digits"
            class="w-full max-w-xs dark:bg-black rounded-tr text-center dark:border-zinc-500/35 outline-none border-blue-500"
            inputmode="numeric" pattern="[0-9]*" placeholder="id" maxlength="3" type="password" />
        </div>
      </form>

      <div
        class="w-full max-w-xs mx-auto flex items-center border-b border-l border-r dark:border-zinc-500/35 border-blue-500 px-1">
        <input
          class="w-48 h-8 max-w-xs px-2 dark:bg-black border-r dark:border-zinc-500/35 border-blue-500 outline-none"
          type="text" id="date" placeholder="Data" name="date" inputmode='none' />
        <input class="w-full max-w-xs px-4 dark:bg-black bg-white outline-none" type="time" id="time"
          placeholder="Hora" />
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="w-full max-w-xs flex justify-between">
      <button id="registerBtn" class="w-full py-2
              text-lg cursor-pointer
              bg-blue-500 text-white rounded-b
              hover:bg-blue-700
              dark:hover:bg-blue-900/85
              dark:bg-blue-900/75
              font-semibold tracking-wide
              transform transition-all duration-150
              data-[isLoading='true']:cursor-not-allowed data-[isLoading='true']:opacity-50 ">
        Registrar
      </button>


    </div>
    <div id="divPontos" class="w-full text-white max-w-xs mt-2 overflow-y-auto space-y-2">
    </div>
  </div>

  <script type="module">
    import { BUTTON_WITH_LOADING, toastSuccess, toastError, toastInfo } from './vars3.js';
    import { api } from './axios.js';

    function getFieldsValues() {
      const name = document.getElementById('name').value.trim().toLowerCase();
      const digits = document.getElementById('digits').value.trim();
      return { name, digits };
    }

    const name = localStorage.getItem('000_name');
    const digits = localStorage.getItem('000_digits');

    /* JAVASCRIPT HTML MANIPULATION */

    if (name && digits) {
      document.getElementById('name').value = name;
      document.getElementById('digits').value = digits;
      atualizarTabelaPontos(name, digits);
    } else {
      form.addEventListener("focusout", (event) => {
        const { name, digits } = getFieldsValues();
        if (name && digits) {
          getPontos(name, digits)
          atualizarTabelaPontos(name, digits);
        }
      });
    }
    document.getElementById('date').value = new Date().toLocaleDateString('pt-BR', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    }).split('/').reverse().join('-'); // Formato YYYY-MM-DD para o input date

    document.getElementById('time').value = new Date().toLocaleTimeString('pt-BR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    const elem = document.querySelector('input[name="date"]');
    const datepicker = new Datepicker(elem, {
      autoHide: true,
      language: 'pt',
      format: 'dd/mm/yyyy',

    });
    datepicker.setDate(new Date());

    document.getElementById('registerBtn').addEventListener('click', async () => {

      const btn = document.getElementById('registerBtn');
      const name = document.getElementById('name').value.trim().toLowerCase();
      const digits = document.getElementById('digits').value.trim();
      const dateFromInput = document.getElementById('date').value;
      const timeFromInput = document.getElementById('time').value;

      if (!name || !digits || digits.length !== 3 || isNaN(digits)) {
        toastInfo("Preencha todos os campos corretamente.");
        return;
      }

      btn.innerHTML = BUTTON_WITH_LOADING;
      btn.disabled = true;
      btn.setAttribute('data-isLoading', 'true');
      try {
        const response = await api.post('register', {
          PK: name,
          SK: digits.toString(),
          name,
          cpf3Digits: digits,
          date: dateFromInput,
          time: timeFromInput
        });

        if (response.status === 200 || response.status === 201) {
          toastSuccess("Registro realizado com sucesso!");
          atualizarTabelaPontos(name, digits);
        } else {
          toastError("Erro ao registrar. Tente novamente.");
        }
      } catch (error) {
        toastError("Erro de comunicação.");
        console.error('Erro ao buscar registros:', error);
      } finally {
        btn.innerHTML = 'Registrar';
        btn.disabled = false;
        btn.setAttribute('data-isLoading', 'false');
        localStorage.setItem('000_name', name);
        localStorage.setItem('000_digits', digits);
      }
    });

    function renderTabelaPontos(pontos) {
      const tabelaDiv = document.getElementById('divPontos');
      if (!pontos || pontos.length === 0) {
        tabelaDiv.innerHTML = '';
        return;
      }

      // Agrupa por data
      const porData = {};
      pontos.forEach(ponto => {
        if (!porData[ponto.date]) porData[ponto.date] = [];
        porData[ponto.date].push(ponto.time);
      });

      // Monta o HTML agrupado por data
      let html = '';
      Object.keys(porData).sort((a, b) => {
        // Ordena datas mais recentes primeiro
        const [da, ma, ya] = a.split('/').map(Number);
        const [db, mb, yb] = b.split('/').map(Number);
        return new Date(yb, mb - 1, db) - new Date(ya, ma - 1, da);
      }).forEach(date => {
        const [day, month, year] = date.split('/').map(Number);
        html += `<div>`
        html += `<div class="text-center text-lg font-bold tracking-wider rounded-t bg-stone-500/15 border-b border-b-black/85 dark:border-b-white/65 dark:text-stone-300 text-black suse ">${date} • ${new Date(year, month - 1, day).toLocaleDateString('pt-BR', { weekday: 'short' })}</div>`;
        html += `<div class="flex justify-between px-1 py-1 mb-1 rounded-b dark:bg-blue-900/75 bg-blue-500">`;
        porData[date]
          .sort() // Ordena horários
          .forEach(time => {
            html += `<div class="text-md mx-2"><a href="#" class="link-delete hover:text-stone-950 dark:text-white suse text-sm transition" data-record="${date}&${time}");">•${time}</a></div>`;
          });
        html += `</div>`;
        html += `</div>`;
      });

      tabelaDiv.innerHTML = html;
    }

    const tabelaDiv = document.getElementById('divPontos');

    tabelaDiv.addEventListener('click', (event) => {
      const linkClicado = event.target.closest('.link-delete');

      if (linkClicado) {
        event.preventDefault();
        deleteRecord(linkClicado.dataset.record);
      }
    });

    function deleteRecord(record) {
      const [date, time] = record.split('&');
      const name = localStorage.getItem('000_name');
      const digits = localStorage.getItem('000_digits');

      if (!name || !digits) {
        toastInfo("Preencha todos os campos corretamente.");
        return;
      }

      if (confirm(`Deseja excluir o registro de ${date} às ${time}?`)) {
        api.delete(`delete/${name}/${digits}/record?date=${date}&time=${time}`)
          .then(response => {
            if (response.status === 200) {
              toastSuccess("Registro excluído com sucesso!");
              atualizarTabelaPontos(name, digits);
            } else {
              toastError("Erro ao excluir o registro.");
            }
          })
          .catch(error => {
            toastError("Erro de comunicação.");
            console.error('Erro ao excluir registro:', error);
          });
      }
    }

    async function getPontos(name, digits) {
      const response = await api.get(`getPontos/${name}/${digits}`);
      return response.data;
    }

    // Função para buscar e atualizar a tabela
    async function atualizarTabelaPontos(name, digits) {
      const cacheKey = `pontos_${name}_${digits}`;
      const cachedData = localStorage.getItem(cacheKey);

      if (cachedData) {
        try {
          const pontos = JSON.parse(cachedData);
          renderTabelaPontos(pontos);
          // console.log("Dados renderizados a partir do cache.");
        } catch (e) {
          console.error("Erro ao processar dados do cache:", e);
          renderSkeleton();
        }
      } else {
        // Se NÃO houver cache, exibe o SKELETON enquanto busca os dados.
        renderSkeleton();
      }

      try {
        const data = await getPontos(name, digits);
        const pontos = data.pontos || [];

        renderTabelaPontos(pontos);
        localStorage.setItem(cacheKey, JSON.stringify(pontos));
      } catch (error) {
        toastError("Erro de comunicação.");
        console.error('Erro ao buscar registros:', error);

        if (!cachedData) {
          const tabelaDiv = document.getElementById('divPontos');
          tabelaDiv.innerHTML = '';
        }
      }
    }

    function renderSkeleton() {
      const tabelaDiv = document.getElementById('divPontos');
      let skeletonHTML = `
          <div class="animate-pulse">
            <div class="h-8 text-center rounded-t bg-stone-500/15 border border-white/5 dark:text-stone-300"></div>
            <div class="h-8 flex justify-between items-center px-1 py-1 mb-1 border-b border-l border-r rounded-b border-white/5 bg-zinc-900">
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
            </div>
          </div>
          <div class="animate-pulse">
            <div class="h-8 text-center rounded-t bg-stone-500/15 border border-white/5 dark:text-stone-300"></div>
            <div class="h-8 flex justify-between items-center px-1 py-1 mb-1 border-b border-l border-r rounded-b border-white/5 bg-zinc-900">
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
            </div>
          </div>
          <div class="animate-pulse">
            <div class="h-8 text-center rounded-t bg-stone-500/15 border border-white/5 dark:text-stone-300"></div>
            <div class="h-8 flex justify-between items-center px-1 py-1 mb-1 border-b border-l border-r rounded-b border-white/5 bg-zinc-900">
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
            </div>
          </div>
          <div class="animate-pulse">
            <div class="h-8 text-center rounded-t bg-stone-500/15 border border-white/5 dark:text-stone-300"></div>
            <div class="h-8 flex justify-between items-center px-1 py-1 mb-1 border-b border-l border-r rounded-b border-white/5 bg-zinc-900">
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
                <div class="text-md mx-2"></div>
            </div>
          </div>
        </div>
      `;
      tabelaDiv.innerHTML = skeletonHTML;
    }
  </script>
</body>
