<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Registrar">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/css/datepicker.min.css">
  <link rel="stylesheet" type="text/css" href="./css/main.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
 
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/datepicker-full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/locales/pt.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script type="module" src="vars.js"></script>
  <script type="module" src="axios.js"></script>
  
  <title>Registrar</title>
</head>

<body class="bg-neutral-900 w-screen h-screen flex items-center justify-center">
  <div class="flex flex-col items-center justify-center gap-2 h-full w-full max-w-xs">
    <div class="w-full mt-10"></div>

    <!-- INPUTS USERS DATA -->
    <div class="w-full max-w-xs mx-auto gap-2 flex items-center">
      <input class="w-48 max-w-xs py-3 px-4 bg-zinc-300 rounded-lg outline-none text-lg hover:bg-zinc-100 transition"
        type="text" id="name" placeholder="Nome" maxlength="20" spellcheck="false"/>
      <input class="w-full max-w-xs py-3 px-4 bg-zinc-300 rounded-lg outline-none text-lg hover:bg-zinc-100 transition"
        type="number" id="digits" inputmode="numeric" pattern="[0-9]*" placeholder="id" maxlength="3" />
    </div>

    <div class="w-full max-w-xs mx-auto gap-2 flex items-center">
      <input class="w-48 max-w-xs py-3 px-4 bg-zinc-300 rounded-lg outline-none text-lg hover:bg-zinc-100 transition"
        type="text" id="date" placeholder="Data" name="date" inputmode='none'/>
      <input class="w-full max-w-xs py-3 px-[14px] bg-zinc-300 rounded-lg outline-none text-lg  hover:bg-zinc-100 transition"
        type="time" id="time" placeholder="Hora" maxlength="3"  />
    </div>

    <!-- BUTTONS -->
    <div class="w-full max-w-xs flex flex-col">
      <button id="registerBtn"
        class="w-full py-3 bg-blue-600 text-white rounded-lg shadow-lg text-lg font-semibold hover:bg-blue-700 transition data-[isLoading='true']:cursor-not-allowed data-[isLoading='true']:opacity-50">
        Registrar
      </button>
      <div class="flex justify-end">
        <div id="version" class="mt-1 text-right text-white text-xs opacity-20">v1.7</div>
      </div>
      
    </div>
    <div id="divPontos" class="w-full flex-1 text-white max-w-xs mb-10 overflow-y-auto"></div>
  </div>

  <script type="module">
      import { BUTTON_WITH_LOADING, toastSuccess, toastError, toastInfo } from './vars.js';
      import { api } from './axios.js';

      const name = localStorage.getItem('000_name');
      const digits = localStorage.getItem('000_digits');

      /* JAVASCRIPT HTML MANIPULATION */

      if(name && digits) {
        document.getElementById('name').value = name;
        document.getElementById('digits').value = digits;
      }
      document.getElementById('date').value = new Date().toLocaleDateString('pt-BR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).split('/').reverse().join('-'); // Formato YYYY-MM-DD para o input date

      document.getElementById('time').value = new Date().toLocaleTimeString('pt-BR', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      const elem = document.querySelector('input[name="date"]');
      const datepicker = new Datepicker(elem, {
        autoHide: true,
        language: 'pt',
        format: 'dd/mm/yyyy',

      });
      datepicker.setDate(new Date());

      document.getElementById('registerBtn').addEventListener('click', async () => {

        const btn = document.getElementById('registerBtn');
        const name = document.getElementById('name').value.trim().toLowerCase();
        const digits = document.getElementById('digits').value.trim();
        const dateFromInput = document.getElementById('date').value;
        const timeFromInput = document.getElementById('time').value;

        if (!name || !digits || digits.length !== 3 || isNaN(digits)) {
            toastInfo("Preencha todos os campos corretamente.");
          return;
        }

        btn.innerHTML = BUTTON_WITH_LOADING;
        btn.disabled = true;
        btn.setAttribute('data-isLoading', 'true');
        try {
          const response = await api.post('register', {
            PK: name,
            SK: digits.toString(),
            name,
            cpf3Digits: digits,
            date: dateFromInput,
            time: timeFromInput
          });

          if (response.status === 200 || response.status === 201) {
            toastSuccess("Registro realizado com sucesso!");
            atualizarTabelaPontos(name, digits);
          } else {
            toastError("Erro ao registrar. Tente novamente.");
          }
        } catch (error) {
            toastError("Erro de comunicação.");
            console.error('Erro ao buscar registros:', error);
        } finally {
          btn.innerHTML = 'Registrar';
          btn.disabled = false;
          btn.setAttribute('data-isLoading', 'false');
          localStorage.setItem('000_name', name);
          localStorage.setItem('000_digits', digits);
        }
    });

    function renderTabelaPontos(pontos) {
      const tabelaDiv = document.getElementById('divPontos');
      if (!pontos || pontos.length === 0) {
        tabelaDiv.innerHTML = '';
        return;
      }

      // Agrupa por data
      const porData = {};
      pontos.forEach(ponto => {
        if (!porData[ponto.date]) porData[ponto.date] = [];
        porData[ponto.date].push(ponto.time);
      });

      // Monta o HTML agrupado por data
      let html = '';
      Object.keys(porData).sort((a, b) => {
        // Ordena datas mais recentes primeiro
        const [da, ma, ya] = a.split('/').map(Number);
        const [db, mb, yb] = b.split('/').map(Number);
        return new Date(yb, mb - 1, db) - new Date(ya, ma - 1, da);
      }).forEach(date => {
        html += `<div class="text-center mb-1 text-lg font-bold tracking-widest text-amber-600">${date}</div>`;
        html += `<div class="flex justify-between items-center mb-2">`;
        porData[date]
          .sort() // Ordena horários
          .forEach(time => {
            html += `<div class="text-md mx-2">• ${time}</div>`;
          });
        html += `</div>`;
      });

      tabelaDiv.innerHTML = html;
    }

    async function getPontos(name, digits) {
      const response = await api.get(`getPontos/${name}/${digits}`);
      return response.data;
    }

    // Função para buscar e atualizar a tabela
    async function atualizarTabelaPontos(name, digits) {
      const cacheKey = `pontos_${name}_${digits}`;
      const cachedData = localStorage.getItem(cacheKey);

      if (cachedData) {
          try {
              const pontos = JSON.parse(cachedData);
              renderTabelaPontos(pontos);
              // console.log("Dados renderizados a partir do cache.");
          } catch (e) {
              console.error("Erro ao processar dados do cache:", e);
              renderSkeleton();
          }
      } else {
        // Se NÃO houver cache, exibe o SKELETON enquanto busca os dados.
        renderSkeleton();
      }

      try {
        const data = await getPontos(name, digits);
        const pontos = data.pontos || [];

        renderTabelaPontos(pontos);
        localStorage.setItem(cacheKey, JSON.stringify(pontos));
      } catch (error) {
        toastError("Erro de comunicação.");
        console.error('Erro ao buscar registros:', error);
      }
    }

    if(name && digits ) {
      atualizarTabelaPontos(name, digits);
    }

    function renderSkeleton() {
      const tabelaDiv = document.getElementById('divPontos');
      let skeletonHTML = `
        <div class="space-y-5 animate-pulse">
          <div class="space-y-2">
            <div class="h-6 bg-neutral-700 rounded w-2/4 mx-auto"></div>
            <div class="flex justify-around items-center gap-2">
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
            </div>
          </div>
          
          <div class="space-y-2">
            <div class="h-6 bg-neutral-700 rounded w-2/4 mx-auto"></div>
            <div class="flex justify-around items-center gap-2">
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
            </div>
          </div>

          <div class="space-y-2">
            <div class="h-6 bg-neutral-700 rounded w-2/4 mx-auto"></div>
            <div class="flex justify-around items-center gap-2">
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
            </div>
          </div>
        </div>
      `;
      tabelaDiv.innerHTML = skeletonHTML;
    }
  </script>
</body>
