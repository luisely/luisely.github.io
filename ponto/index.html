<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Registrar">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/css/datepicker.min.css">
  <link rel="stylesheet" type="text/css" href="./css/main.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/datepicker-full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/locales/pt.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script type="module" src="vars3.js"></script>
  <script type="module" src="axios.js"></script>


  <style>
    input {
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
  </style>

  <title>Registrar</title>
</head>

<body class="bg-[url('./css/fundo2.jpg')] bg-center bg-cover w-dvw h-dvh flex items-center justify-center py-4">
  <div class="flex flex-col items-center justify-center h-full w-full max-w-xs">
    <div class="w-full"></div>

    <!-- INPUTS USERS DATA -->
    <div class="">
      <div
        class="w-full max-w-xs mx-auto flex border-b border-l border-t border-r border-[#3d3940] rounded-t-md border-opacity-35 items-center">
        <input
          class="w-48 max-w-xs py-2 px-4 bg-[#d9d5c3] bg-opacity-35 outline-none rounded-tl-md border-r border-opacity-35 border-[#3d3940] backdrop-blur-md text-lg transition hover:brightness-110"
          type="text" id="name" placeholder="Nome" maxlength="20" spellcheck="false" />
        <input id="digits"
          class="w-full max-w-xs py-2 rounded-tr text-center bg-[#d9d5c3] bg-opacity-35 backdrop-blur-md outline-none  text-lg transition hover:brightness-110"
          inputmode="numeric" pattern="[0-9]*" placeholder="id" maxlength="3" type="number" />
      </div>

      <div
        class="w-full max-w-xs mx-auto flex items-center border-b border-l border-r border-opacity-35 border-[#3d3940]">
        <input
          class="w-48 h-[46px] max-w-xs py-2 px-4 bg-[#d9d5c3] bg-opacity-35 border-r border-[#3d3940] border-opacity-35 backdrop-blur-md outline-none text-lg transition hover:brightness-110"
          type="text" id="date" placeholder="Data" name="date" inputmode='none' />
        <input
          class="w-full max-w-xs py-2 px-4 bg-[#d9d5c3] bg-opacity-35 backdrop-blur-md outline-none text-lg transition hover:brightness-110"
          type="time" id="time" placeholder="Hora" maxlength="3" />
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="w-full max-w-xs flex justify-between">
      <button id="registerBtn" class="w-full py-2
             text-[#3d3940]
              text-lg
             bg-[#3d3940] bg-opacity-15  rounded-b
              font-semibold tracking-wide
              transform transition-all duration-150
              hover:brightness-110
              backdrop-blur-md -mt-[1px]
               border-[#3d3940] border-opacity-35 border
              data-[isLoading='true']:cursor-not-allowed data-[isLoading='true']:opacity-50">
        Registrar
      </button>


    </div>
    <div id="divPontos" class="w-full text-white max-w-xs mt-1 overflow-y-auto backdrop-blur-md rounded-t rounded-b">
    </div>
  </div>

  <script type="module">
    import { BUTTON_WITH_LOADING, toastSuccess, toastError, toastInfo } from './vars3.js';
    import { api } from './axios.js';

    const name = localStorage.getItem('000_name');
    const digits = localStorage.getItem('000_digits');

    /* JAVASCRIPT HTML MANIPULATION */

    if (name && digits) {
      document.getElementById('name').value = name;
      document.getElementById('digits').value = digits;
    }
    document.getElementById('date').value = new Date().toLocaleDateString('pt-BR', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    }).split('/').reverse().join('-'); // Formato YYYY-MM-DD para o input date

    document.getElementById('time').value = new Date().toLocaleTimeString('pt-BR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    const elem = document.querySelector('input[name="date"]');
    const datepicker = new Datepicker(elem, {
      autoHide: true,
      language: 'pt',
      format: 'dd/mm/yyyy',

    });
    datepicker.setDate(new Date());

    document.getElementById('registerBtn').addEventListener('click', async () => {

      const btn = document.getElementById('registerBtn');
      const name = document.getElementById('name').value.trim().toLowerCase();
      const digits = document.getElementById('digits').value.trim();
      const dateFromInput = document.getElementById('date').value;
      const timeFromInput = document.getElementById('time').value;

      if (!name || !digits || digits.length !== 3 || isNaN(digits)) {
        toastInfo("Preencha todos os campos corretamente.");
        return;
      }

      btn.innerHTML = BUTTON_WITH_LOADING;
      btn.disabled = true;
      btn.setAttribute('data-isLoading', 'true');
      try {
        const response = await api.post('register', {
          PK: name,
          SK: digits.toString(),
          name,
          cpf3Digits: digits,
          date: dateFromInput,
          time: timeFromInput
        });

        if (response.status === 200 || response.status === 201) {
          toastSuccess("Registro realizado com sucesso!");
          atualizarTabelaPontos(name, digits);
        } else {
          toastError("Erro ao registrar. Tente novamente.");
        }
      } catch (error) {
        toastError("Erro de comunicação.");
        console.error('Erro ao buscar registros:', error);
      } finally {
        btn.innerHTML = 'Registrar';
        btn.disabled = false;
        btn.setAttribute('data-isLoading', 'false');
        localStorage.setItem('000_name', name);
        localStorage.setItem('000_digits', digits);
      }
    });

    function renderTabelaPontos(pontos) {
      const tabelaDiv = document.getElementById('divPontos');
      if (!pontos || pontos.length === 0) {
        tabelaDiv.innerHTML = '';
        return;
      }

      // Agrupa por data
      const porData = {};
      pontos.forEach(ponto => {
        if (!porData[ponto.date]) porData[ponto.date] = [];
        porData[ponto.date].push(ponto.time);
      });

      // Monta o HTML agrupado por data
      let html = '';
      Object.keys(porData).sort((a, b) => {
        // Ordena datas mais recentes primeiro
        const [da, ma, ya] = a.split('/').map(Number);
        const [db, mb, yb] = b.split('/').map(Number);
        return new Date(yb, mb - 1, db) - new Date(ya, ma - 1, da);
      }).forEach(date => {
        html += `<div class="p-2 border-l border-r bg-[#d9d5c3] border-[#3d3940] border-opacity-35 first:rounded-t first:border-t last:rounded-b last:border-b bg-opacity-35 ">`
        html += `<div class="text-center text-lg font-bold tracking-wider rounded-t bg-[#3d3940] border border-[#3d3940] border-opacity-35 text-[#3d3940] bg-opacity-15 ">${date}</div>`;
        html += `<div class="flex justify-between items-center px-1 py-1 mb-1 border-b border-l border-r rounded-b border-[#3d3940] border-opacity-35">`;
        porData[date]
          .sort() // Ordena horários
          .forEach(time => {
            html += `<div class="text-md mx-2"><a href="#" class="link-delete hover:text-[#8b2c2c] text-zinc-800" data-record="${date}&${time}");">• ${time}</a></div>`;
          });
        html += `</div>`;
        html += `</div>`;
      });

      tabelaDiv.innerHTML = html;
    }

    const tabelaDiv = document.getElementById('divPontos');

    tabelaDiv.addEventListener('click', (event) => {
      const linkClicado = event.target.closest('.link-delete');

      if (linkClicado) {
        event.preventDefault();
        deleteRecord(linkClicado.dataset.record);
      }
    });

    function deleteRecord(record) {
      const [date, time] = record.split('&');
      const name = localStorage.getItem('000_name');
      const digits = localStorage.getItem('000_digits');

      if (!name || !digits) {
        toastInfo("Preencha todos os campos corretamente.");
        return;
      }

      if (confirm(`Deseja excluir o registro de ${date} às ${time}?`)) {
        api.delete(`delete/${name}/${digits}/record?date=${date}&time=${time}`)
          .then(response => {
            if (response.status === 200) {
              toastSuccess("Registro excluído com sucesso!");
              atualizarTabelaPontos(name, digits);
            } else {
              toastError("Erro ao excluir o registro.");
            }
          })
          .catch(error => {
            toastError("Erro de comunicação.");
            console.error('Erro ao excluir registro:', error);
          });
      }
    }

    async function getPontos(name, digits) {
      const response = await api.get(`getPontos/${name}/${digits}`);
      return response.data;
    }

    // Função para buscar e atualizar a tabela
    async function atualizarTabelaPontos(name, digits) {
      const cacheKey = `pontos_${name}_${digits}`;
      const cachedData = localStorage.getItem(cacheKey);

      if (cachedData) {
        try {
          const pontos = JSON.parse(cachedData);
          renderTabelaPontos(pontos);
          // console.log("Dados renderizados a partir do cache.");
        } catch (e) {
          console.error("Erro ao processar dados do cache:", e);
          renderSkeleton();
        }
      } else {
        // Se NÃO houver cache, exibe o SKELETON enquanto busca os dados.
        renderSkeleton();
      }

      try {
        const data = await getPontos(name, digits);
        const pontos = data.pontos || [];

        renderTabelaPontos(pontos);
        localStorage.setItem(cacheKey, JSON.stringify(pontos));
      } catch (error) {
        toastError("Erro de comunicação.");
        console.error('Erro ao buscar registros:', error);

        if (!cachedData) {
          const tabelaDiv = document.getElementById('divPontos');
          tabelaDiv.innerHTML = '';
        }
      }
    }

    if (name && digits) {
      atualizarTabelaPontos(name, digits);
    }

    function renderSkeleton() {
      const tabelaDiv = document.getElementById('divPontos');
      let skeletonHTML = `
        <div class="space-y-5 animate-pulse">
          <div class="space-y-2">
            <div class="h-6 bg-neutral-700 rounded w-2/4 mx-auto"></div>
            <div class="flex justify-around items-center gap-2">
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
            </div>
          </div>
          
          <div class="space-y-2">
            <div class="h-6 bg-neutral-700 rounded w-2/4 mx-auto"></div>
            <div class="flex justify-around items-center gap-2">
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
            </div>
          </div>

          <div class="space-y-2">
            <div class="h-6 bg-neutral-700 rounded w-2/4 mx-auto"></div>
            <div class="flex justify-around items-center gap-2">
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
              <div class="h-5 bg-neutral-700 rounded w-1/4"></div>
            </div>
          </div>
        </div>
      `;
      tabelaDiv.innerHTML = skeletonHTML;
    }
  </script>
</body>
