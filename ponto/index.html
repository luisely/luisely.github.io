<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Registrar">
  <link rel="apple-touch-icon" href="180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <title>Registrar</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  
</head>
<style>
  body {
    font-family: "Inter", sans-serif;
  }
  #divPontos::-webkit-scrollbar {
    display: none;
  }
  #divPontos {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;     /* Firefox */
  }
</style>

<body class="bg-zinc-900 flex flex-col items-center justify-center min-h-screen gap-2">
  <div class="w-full max-w-xs mx-auto gap-2 flex items-center">
    <input class="w-full max-w-xs py-3 px-4 bg-zinc-300 rounded-lg outline-none text-lg hover:bg-zinc-100 transition"
      type="text" id="name" placeholder="Nome" maxlength="20"/>
    <input class="w-24 max-w-xs py-3 px-4 bg-zinc-300 rounded-lg outline-none text-lg hover:bg-zinc-100 transition"
      type="number" id="digits" inputmode="numeric" pattern="[0-9]*" placeholder="3 Digits" maxlength="3" />
  </div>
  <div class="w-full max-w-xs flex flex-col">
    <button id="registerBtn"
      class="w-full py-3 bg-blue-600 text-white rounded-lg shadow-lg text-lg font-semibold hover:bg-blue-700 transition">
      Registrar
    </button>
    <div id="version" class="mt-1 text-right text-white text-xs opacity-20">v1.2</div>
  </div>
  <div id="divPontos" class="w-full text-white h-32 max-w-xs mt-2 overflow-y-auto" ></div>


  <script>
      const name = localStorage.getItem('000_name');
      const digits = localStorage.getItem('000_digits');

      if(name && digits) {
        document.getElementById('name').value = name;
        document.getElementById('digits').value = digits;
      }
      document.getElementById('registerBtn').addEventListener('click', async () => {

        const btn = document.getElementById('registerBtn');
        const name = document.getElementById('name').value.trim().toLowerCase();
        const digits = document.getElementById('digits').value.trim();

        if (!name || !digits || digits.length !== 3 || isNaN(digits)) {
            Toastify({
              text: "Faltou preencher os campos. ;)",
              className: "rounded-lg",
              duration: 3000,
              gravity: "top",
              position: "center",
              backgroundColor: "#f48d2c",
            }).showToast();
          return;
        }

        // Pega data atual no formato BR (dd/mm/yyyy)
        const now = new Date();
        const dateBR = now.toLocaleDateString('pt-BR', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        });

        btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 inline-block text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                          </svg> Registrando...`;
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        try {
          const response = await axios.post('https://t6d9wao8qd.execute-api.us-east-1.amazonaws.com/register', {
            PK: name,
            SK: digits.toString(),
            name,
            cpf3Digits: digits,
            date: dateBR,
            time: now.toLocaleTimeString('pt-BR', {
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            })
          });

          if (response.status === 200 || response.status === 201) {
              Toastify({
                text: "Registrado com sucesso!",
                className: "rounded-lg",
                duration: 3000,
                gravity: "top",
                position: "center",
                backgroundColor: "#22c55e",
              }).showToast();
            atualizarTabelaPontos(name, digits);
          } else {
            Toastify({
              text: "Erro ao registrar.",
              className: "rounded-lg",
              duration: 3000,
              gravity: "top",
              position: "center",
              backgroundColor: "#ef4444",
            }).showToast();
          }
        } catch (error) {
            Toastify({
              text: "Erro de comunicação.",
              className: "rounded-lg",
              duration: 3000,
              gravity: "top",
              position: "center",
              backgroundColor: "#ef4444",
            }).showToast();
        } finally {
          btn.innerHTML = 'Registrar';
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
          localStorage.setItem('000_name', name);
          localStorage.setItem('000_digits', digits);
        }
    });

    function renderTabelaPontos(pontos) {
      const tabelaDiv = document.getElementById('divPontos');
      if (!pontos || pontos.length === 0) {
        tabelaDiv.innerHTML = '';
        return;
      }

      // Agrupa por data
      const porData = {};
      pontos.forEach(ponto => {
        if (!porData[ponto.date]) porData[ponto.date] = [];
        porData[ponto.date].push(ponto.time);
      });

      // Monta o HTML agrupado por data
      let html = '';
      Object.keys(porData).sort((a, b) => {
        // Ordena datas mais recentes primeiro
        const [da, ma, ya] = a.split('/').map(Number);
        const [db, mb, yb] = b.split('/').map(Number);
        return new Date(yb, mb - 1, db) - new Date(ya, ma - 1, da);
      }).forEach(date => {
        html += `<div class="text-center mb-1 text-lg font-bold tracking-widest">${date}</div>`;
        html += `<div class="flex justify-between items-center mb-2">`;
        porData[date]
          .sort() // Ordena horários
          .forEach(time => {
            html += `<div class="text-md mx-2">• ${time}</div>`;
          });
        html += `</div>`;
      });

      tabelaDiv.innerHTML = html;
    }

    async function getPontos(name, digits) {
      const response = await axios.get(`https://t6d9wao8qd.execute-api.us-east-1.amazonaws.com/getPontos/${name}/${digits}`);
      return response.data;
    }

    // Função para buscar e atualizar a tabela
    async function atualizarTabelaPontos(name, digits) {
      try {
        const data = await getPontos(name, digits);
        const pontos = data.pontos || [];
        renderTabelaPontos(pontos);
      } catch (error) {
        Toastify({
          text: "Erro de comunicação.",
          className: "rounded-lg",
          duration: 3000,
          gravity: "top",
          position: "center",
          backgroundColor: "#ef4444",
        }).showToast();
        console.error('Erro ao buscar registros:', error);
      }
    }

    if(name && digits) {
      atualizarTabelaPontos(name, digits);
    }
  </script>
</body>
