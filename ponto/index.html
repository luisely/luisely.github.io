<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Registrar">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/css/datepicker.min.css">
  <link rel="stylesheet" type="text/css" href="./css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=SUSE+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/datepicker-full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/locales/pt.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script type="module" src="vars3.js"></script>
  <script type="module" src="axios.js"></script>
  <script type="module" src="src/modal.js"></script>


  <style>
    input {
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
  </style>

  <title>Registrar</title>
</head>

<body class="dark:bg-black w-dvw h-dvh flex items-center justify-center py-4">
  <div class="flex flex-col items-center justify-center h-full w-full max-w-[340px]">
    <div class="w-full"></div>

    <!-- INPUTS USERS DATA -->
    <div class="dark:text-white text-lg">
      <form id="form">
        <div
          class="w-full max-w-[340px] mx-auto flex border-b border-l border-t border-r rounded-t-md dark:border-zinc-500/35 border-blue-500 items-center px-1">
          <input
            class="w-48 h-8 max-w-[340px] px-2 dark:bg-black outline-none rounded-md border-r dark:border-zinc-500/35 border-blue-500"
            type="text" id="name" placeholder="Nome" maxlength="20" spellcheck="false" />
          <input id="digits"
            class="w-full max-w-[340px] dark:bg-black rounded-tr text-center dark:border-zinc-500/35 outline-none border-blue-500"
            inputmode="numeric" pattern="[0-9]*" placeholder="id" maxlength="3" type="password" />
        </div>
      </form>

      <div
        class="w-full max-w-[340px] mx-auto flex items-center border-b border-l border-r dark:border-zinc-500/35 border-blue-500 px-1">
        <input
          class="w-48 h-8 max-w-[340px] px-2 dark:bg-black border-r dark:border-zinc-500/35 border-blue-500 outline-none"
          type="text" id="date" placeholder="Data" name="date" inputmode='none' />
        <input class="w-full max-w-[340px] px-4 dark:bg-black bg-white outline-none" type="time" id="time"
          placeholder="Hora" />
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="w-full max-w-[340px] flex justify-between">
      <button id="registerBtn" class="w-full py-2
              text-lg cursor-pointer
              bg-blue-500 text-white rounded-b
              hover:bg-blue-700
              dark:hover:bg-blue-900/85
              dark:bg-blue-900/75
              font-semibold tracking-wide
              transform transition-all duration-150
              data-[isLoading='true']:cursor-not-allowed data-[isLoading='true']:opacity-50 ">
        Registrar
      </button>


    </div>
    <div id="divPontos" class="w-full text-white max-w-[340px] mt-2 overflow-y-auto space-y-2">
    </div>
  </div>

  <script type="module">
    import { api } from './axios.js';
    import { atualizarTabelaPontos } from './src/atualizarTabelaPontos.js';
    import { getPontos } from './src/getPontos.js';
    import { showDeleteModal } from './src/modal.js';
    import { BUTTON_WITH_LOADING, tabelaDiv, toastError, toastInfo, toastSuccess } from './vars3.js';

    function getFieldsValues() {
      const name = document.getElementById('name').value.trim().toLowerCase();
      const digits = document.getElementById('digits').value.trim();
      return { name, digits };
    }

    const name = localStorage.getItem('000_name');
    const digits = localStorage.getItem('000_digits');

    /* JAVASCRIPT HTML MANIPULATION */

    if (name && digits) {
      document.getElementById('name').value = name;
      document.getElementById('digits').value = digits;
      atualizarTabelaPontos(name, digits);
    } else {
      form.addEventListener("focusout", (event) => {
        const { name, digits } = getFieldsValues();
        if (name && digits) {
          getPontos(name, digits)
          atualizarTabelaPontos(name, digits);
        }
      });
    }
    document.getElementById('date').value = new Date().toLocaleDateString('pt-BR', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    }).split('/').reverse().join('-'); // Formato YYYY-MM-DD para o input date

    document.getElementById('time').value = new Date().toLocaleTimeString('pt-BR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    const elem = document.querySelector('input[name="date"]');
    const datepicker = new Datepicker(elem, {
      autoHide: true,
      language: 'pt',
      format: 'dd/mm/yyyy',

    });
    datepicker.setDate(new Date());

    document.getElementById('registerBtn').addEventListener('click', async () => {

      const btn = document.getElementById('registerBtn');
      const name = document.getElementById('name').value.trim().toLowerCase();
      const digits = document.getElementById('digits').value.trim();
      const dateFromInput = document.getElementById('date').value;
      const timeFromInput = document.getElementById('time').value;

      if (!name || !digits || digits.length !== 3 || isNaN(digits)) {
        toastInfo("Preencha todos os campos corretamente.");
        return;
      }

      btn.innerHTML = BUTTON_WITH_LOADING;
      btn.disabled = true;
      btn.setAttribute('data-isLoading', 'true');
      try {
        const response = await api.post('register', {
          PK: name,
          SK: digits.toString(),
          name,
          cpf3Digits: digits,
          date: dateFromInput,
          time: timeFromInput
        });

        if (response.status === 200 || response.status === 201) {
          toastSuccess("Registro realizado com sucesso!");
          atualizarTabelaPontos(name, digits);
        } else {
          toastError("Erro ao registrar. Tente novamente.");
        }
      } catch (error) {
        toastError("Erro de comunicação.");
        console.error('Erro ao buscar registros:', error);
      } finally {
        btn.innerHTML = 'Registrar';
        btn.disabled = false;
        btn.setAttribute('data-isLoading', 'false');
        localStorage.setItem('000_name', name);
        localStorage.setItem('000_digits', digits);
      }
    });

    tabelaDiv.addEventListener('click', (event) => {
      const linkClicado = event.target.closest('.link-delete');

      if (linkClicado) {
        event.preventDefault();
        showDeleteModal(linkClicado.dataset.record);
      }
    });

  </script>
</body>

</html>
